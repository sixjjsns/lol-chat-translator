name: Build Windows

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build EXE (onedir)
        run: |
          pyinstaller --noconfirm --clean `
            --name "LoLChatTranslator" `
            --icon "src/lolchattranslator/resources/icons/app_icon.ico" `
            --add-data "config/default_config.json;config" `
            --add-data "src/lolchattranslator/resources;resources" `
            --windowed `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoLChatTranslator-windows
          path: dist/LoLChatTranslator/
